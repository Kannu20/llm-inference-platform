# k8s/base/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: llm-platform
  labels:
    app.kubernetes.io/part-of: llm-platform
---
# ConfigMap for non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-platform-config
  namespace: llm-platform
data:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  PII_REDACTION_ENABLED: "true"
  REDIS_URL: "redis://redis-service:6379"
  CORS_ORIGINS: "http://frontend-service:3000"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW_MS: "60000"
